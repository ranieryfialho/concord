<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:" />
    <title>Concord</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1c20;
        color: #dcdee4;
        font-family: 'Segoe UI', system-ui, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .mark {
        width: 96px;
        height: 96px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.92);
        }
      }
      .status {
        font-size: 13px;
        color: #969aa6;
        text-align: center;
        padding: 0 24px;
      }
      .title {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <img class="mark" src="icon.png" alt="" draggable="false" />
    <div class="title">Concord</div>
    <div class="status" id="status">Iniciando…</div>
    <script>
      window.setStatus = (text) => {
        document.getElementById('status').textContent = text;
      };
    </script>
  </body>
</html>
