# Concord behind an existing Nginx Proxy Manager (no Caddy, no published HTTP port).
#   cp .env.example .env   # fill in CONCORD_DOMAIN, TURN_HOST, TURN_SECRET, NPM_NETWORK
#   docker compose -f docker-compose.npm.yml up -d --build
# Then, in NPM: Proxy Host  CONCORD_DOMAIN -> http://concord:3001, "Websockets Support" on, SSL via Let's Encrypt.

services:
  concord:
    build: ..
    container_name: concord
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      TURN_URLS: "turn:${TURN_HOST}:3478?transport=udp,turn:${TURN_HOST}:3478?transport=tcp"
      TURN_SECRET: ${TURN_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - concord-data:/data
    networks:
      - proxy
    # Keep Whisper from starving the other sites on this machine.
    cpus: ${CONCORD_CPUS:-2}
    mem_limit: ${CONCORD_MEMORY:-3g}

  coturn:
    image: coturn/coturn:4.7
    container_name: concord-coturn
    restart: unless-stopped
    network_mode: host
    cpus: 1
    mem_limit: 256m
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${CONCORD_DOMAIN}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into private networks (SSRF through TURN), including this host's Docker networks.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  concord-data:

networks:
  proxy:
    name: ${NPM_NETWORK}
    external: true
