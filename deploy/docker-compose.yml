# Concord in production: app + HTTPS (Caddy) + TURN (coturn) + optional SFU (LiveKit).
#   cp .env.example .env   # fill in the values
#   docker compose up -d --build                      # mesh voice (P2P + TURN)
#   docker compose --profile livekit up -d --build    # also start LiveKit (set LIVEKIT_* in .env)

services:
  concord:
    build: ..
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      TURN_URLS: "turn:${TURN_HOST:-${CONCORD_DOMAIN}}:3478?transport=udp,turn:${TURN_HOST:-${CONCORD_DOMAIN}}:3478?transport=tcp"
      TURN_SECRET: ${TURN_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - concord-data:/data

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CONCORD_DOMAIN: ${CONCORD_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.invalid}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - concord

  coturn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${CONCORD_DOMAIN}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into private networks (SSRF through TURN).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["livekit"]
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  concord-data:
  caddy-data:
  caddy-config:
