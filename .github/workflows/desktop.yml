name: Build do app desktop

# Gera os instaladores (Windows, macOS, Linux) e envia cada um direto para a VPS, de onde a página
# /download do Concord os serve. Os latest*.yml e .blockmap vão junto: são o feed do
# atualizador automático do app (desktop/updater.js). O repositório é privado, então não usamos GitHub Releases.
#   Nova versão: suba "version" em desktop/package.json, depois
#   git tag desktop-v0.2.0 && git push --tags      (ou Actions > Run workflow)
on:
  push:
    tags: [ "desktop-v*" ]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/latest.yml
          - os: macos-latest
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.dmg.blockmap
          - os: ubuntu-latest
            artifacts: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências do desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --workspace desktop --include=dev

      - name: Gerar instalador
        run: npm run dist -w desktop

      # Cada job envia o próprio instalador direto para a VPS (scp): sem passar pelo armazenamento de
      # artefatos do GitHub, que tem cota pequena. Os latest*.yml vão por último na lista (o feed do
      # atualizador só deve apontar para a versão nova depois que o instalador já estiver lá).
      - name: Enviar para a VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          FILES: ${{ matrix.artifacts }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/concord_deploy
          chmod 600 ~/.ssh/concord_deploy
          opts="-i $HOME/.ssh/concord_deploy -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30"
          ls -lh $FILES
          for f in $FILES; do
            echo "-> $f"
            scp $opts "$f" "$VPS_USER@$VPS_HOST:concord/downloads/"
          done
